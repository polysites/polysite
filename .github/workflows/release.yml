name: Release

# Turns a version tag into published, scanned, attested images and a DRAFT GitHub release. It never deploys anything:
# production changes only when someone runs deploy/deploy.sh (docs/guide/deploying.md).
#
#   push of a tag v1.2.3 or v1.2.3-beta.1   the real release
#   manual run ("Run workflow")              a dry run: the same checks, gates, builds and scan, but nothing is pushed,
#                                            attested or released. Safe to run on any branch to see whether a release would work.
#
# Order: prepare (tag matches VERSION, package versions and CHANGELOG) -> gates (the same jobs CI runs) -> build, scan and
# push each image -> smoke-test the pushed digests -> draft release with the changelog section and checksums.
#
# Every action is pinned to a full commit SHA, with the release it was resolved from in the trailing comment
# (`uses: owner/repo@<sha> # vX.Y.Z`). Dependabot's github-actions ecosystem (.github/dependabot.yml) reads that comment and
# proposes the next release as a pull request that changes the SHA and the comment together; read the release notes before merging.
# The vulnerability scanner runs from its container image (pinned by digest below) rather than a third-party action, so no
# third-party code gets access to the registry login.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build in this dry run (a real release always builds amd64 and arm64)"
        required: false
        default: "linux/amd64"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      owner: ${{ steps.mode.outputs.owner }}
      platforms: ${{ steps.mode.outputs.platforms }}
      platform_matrix: ${{ steps.mode.outputs.platform_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mode and image namespace
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            platforms="linux/amd64,linux/arm64"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            platforms="${INPUT_PLATFORMS:-linux/amd64}"
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          # One build job per platform, each on a runner of that architecture (nothing is built under emulation).
          matrix=$(printf '%s' "$platforms" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({platform: ., arch: (split("/")[1]), runner: (if . == "linux/arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)})')
          echo "platform_matrix=$matrix" >> "$GITHUB_OUTPUT"
          # Registry namespaces must be lower case.
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Tag, VERSION, package versions and changelog agree
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            sh .github/scripts/check-version.sh "$REF_NAME"
          else
            # A dry run on a branch: report problems as warnings instead of stopping.
            sh .github/scripts/check-version.sh --lenient "$(cat VERSION)"
          fi
      - name: The tagged commit is on main or a release branch
        if: github.event_name == 'push'
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -Eq 'origin/(main|release/.+)$'; then
            echo "::error::The tagged commit is not on main or a release/* branch. Tag a commit that has been through review and CI."
            exit 1
          fi
      - name: Release notes from the changelog
        env:
          IS_PUSH: ${{ github.event_name == 'push' }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          if [ "$IS_PUSH" = true ]; then sh .github/scripts/changelog-section.sh "$VERSION" > out/RELEASE_NOTES.md
          else sh .github/scripts/changelog-section.sh Unreleased > out/RELEASE_NOTES.md || echo "(no notes yet)" > out/RELEASE_NOTES.md; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: out/RELEASE_NOTES.md
      - name: Summary
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MINOR: ${{ steps.v.outputs.minor }}
          LATEST: ${{ steps.v.outputs.latest }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
          DRY: ${{ steps.mode.outputs.dry_run }}
          OWNER: ${{ steps.mode.outputs.owner }}
        run: |
          {
            dry=""; [ "$DRY" != true ] || dry=" (dry run: nothing is pushed)"
            echo "## Polysite $VERSION$dry"
            echo
            echo "Images: \`ghcr.io/$OWNER/polysite-cms\`, \`polysite-web\`, \`polysite-backup\`"
            echo
            tags="v$VERSION"
            [ "$PRERELEASE" != false ] || tags="$tags, v$MINOR"
            [ "$LATEST" != true ] || tags="$tags, latest"
            echo "Tags (after the smoke test): $tags"
            [ "$PRERELEASE" = false ] || echo "This is a pre-release: it never moves \`v$MINOR\` or \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The same jobs CI runs on every push: lint, unit tests, migration checks, image builds, the fresh-install smoke test,
  # and (when the key exists) the plugin end-to-end checks.
  gates:
    name: CI gates
    needs: prepare
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # One job per image and platform, each on a runner of that architecture (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm,
  # which GitHub provides free for public repositories). Building arm64 under QEMU emulation on an x86 runner hung on the web
  # image's Nuxt build (the 0.1.0-beta.1 and 0.1.0-beta.2 releases), so nothing is emulated. Each job pushes its image BY DIGEST
  # only; the merge job below puts the digests under the version tag. The vulnerability scan runs on the amd64 build, before
  # anything of that image is pushed.
  build:
    name: Image ${{ matrix.image }} (${{ matrix.platform.arch }})
    needs: [prepare, gates]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write        # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        image: [cms, web, backup]
        platform: ${{ fromJSON(needs.prepare.outputs.platform_matrix) }}
        include:
          - image: cms
            dockerfile: apps/cms/Dockerfile
            context: .
            target: run
            description: "Polysite CMS: the Payload admin and API"
          - image: web
            dockerfile: apps/web/Dockerfile
            context: .
            target: run
            description: "Polysite web: the public Nuxt site"
          - image: backup
            dockerfile: backup/Dockerfile
            context: backup
            target: ""
            description: "Polysite backup: scheduled database and media backups (Postgres 16 client)"
    env:
      NAME: ghcr.io/${{ needs.prepare.outputs.owner }}/polysite-${{ matrix.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The images hold the core only. themes/ and plugins/ are separate repositories that the Dockerfiles copy when
      # present; here they are empty (themes and plugins are fixed at build time, so a site that uses them builds its own).
      - name: Empty themes and plugins folders
        run: mkdir -p themes plugins
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image labels
        id: meta
        env:
          DESCRIPTION: ${{ matrix.description }}
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=polysite-$IMAGE"
            echo "org.opencontainers.image.description=$DESCRIPTION"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.vendor=Polysite"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # 1. On amd64: build the image into the local Docker daemon and scan it BEFORE anything is pushed.
      - name: Build (amd64, local) for the scan
        if: matrix.platform.arch == 'amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: scan/polysite-${{ matrix.image }}:${{ needs.prepare.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POLYSITE_VERSION=${{ needs.prepare.outputs.version }}
            POLYSITE_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
      - name: Vulnerability scan (fails on HIGH or CRITICAL, except what .trivyignore explains)
        if: matrix.platform.arch == 'amd64'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image --no-progress --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /.trivyignore "scan/polysite-${{ matrix.image }}:$VERSION"
      - name: Log in to GHCR
        if: needs.prepare.outputs.dry_run == 'false'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 2. The real build for this platform, pushed by digest (a dry run builds it too but pushes nothing). The attestations
      #    are made on the merged image below, by digest, so no BuildKit attestation is attached to the single-platform image.
      - name: Build this platform (pushed by digest unless this is a dry run)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POLYSITE_VERSION=${{ needs.prepare.outputs.version }}
            POLYSITE_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.NAME }},push-by-digest=true,name-canonical=true,push=${{ needs.prepare.outputs.dry_run == 'false' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
      - name: Record this platform's digest
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.prepare.outputs.dry_run == 'false'
        with:
          name: platform-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Puts the per-platform images under the version tag as one multi-architecture image, then attests that image by digest
  # (never by tag), writes its SBOM and records the digest for the smoke test and the release.
  merge:
    name: Publish ${{ matrix.image }}
    needs: [prepare, build]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push the manifest to GHCR
      id-token: write        # sign the provenance attestation
      attestations: write    # store the attestations
    strategy:
      fail-fast: false
      matrix:
        image: [cms, web, backup]
    env:
      NAME: ghcr.io/${{ needs.prepare.outputs.owner }}/polysite-${{ matrix.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the exact version is pushed here. vX.Y and latest move in the promote job, after the smoke test.
      - name: Create the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          [ "$(ls | wc -l)" -ge 1 ] || { echo "::error::No platform digests were recorded"; exit 1; }
          docker buildx imagetools create --tag "$NAME:v$VERSION" $(printf "$NAME@sha256:%s " *)
      - name: Digest of the published image
        id: digest
        run: |
          set -eu
          digest=$(docker buildx imagetools inspect "$NAME:v$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "::error::Could not read the digest of $NAME:v$VERSION"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$NAME:v$VERSION"
      # Attest by digest, never by tag.
      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the pushed image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          docker run --rm -v "$HOME/.docker:/root/.docker:ro" -v "$PWD:/out" "$TRIVY_IMAGE" image --no-progress \
            --format spdx-json --output "/out/sbom-${{ matrix.image }}.spdx.json" "$NAME@$DIGEST"
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          echo "$NAME@$DIGEST" > "${{ matrix.image }}.ref"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: |
            ${{ matrix.image }}.ref
            sbom-${{ matrix.image }}.spdx.json

  # Pulls the images that were just published BY DIGEST and runs the fresh-install smoke test against them, so what is
  # tested is exactly what was released. If it fails, the images stay in the registry under their exact version tag only
  # (nothing is deleted, but vX.Y and latest have not moved and no release is drafted): docs/guide/releasing.md says what to do.
  smoke-published:
    name: Smoke test the published digests
    needs: [prepare, merge]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        env:
          EXPECT_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          CMS_IMAGE=$(cat digests/cms.ref) WEB_IMAGE=$(cat digests/web.ref) BACKUP_IMAGE=$(cat digests/backup.ref) \
            sh .github/scripts/smoke-images.sh

  # Only now do the moving tags move, and only for a stable release: vX.Y, and latest. A pre-release (-beta.1, -rc.1) never
  # moves either. Copying by digest keeps the attestations attached to the same image.
  promote:
    name: Move vX.Y and latest
    needs: [prepare, smoke-published]
    if: needs.prepare.outputs.dry_run == 'false' && needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MINOR: ${{ needs.prepare.outputs.minor }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag by digest
        run: |
          for image in cms web backup; do
            ref=$(cat "digests/$image.ref")
            docker buildx imagetools create --tag "${ref%@*}:v$MINOR" --tag "${ref%@*}:latest" "$ref"
          done

  release:
    name: Draft GitHub release
    needs: [prepare, smoke-published, promote]
    if: always() && needs.prepare.outputs.dry_run == 'false' && needs.smoke-published.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Deployment bundle and checksums
        run: |
          mkdir -p dist bundle/deploy
          cp docker-compose.prod.yml Caddyfile .env.example VERSION bundle/
          cp deploy/deploy.sh bundle/deploy/
          # The exact images of this release, by digest, for anyone who wants to pin them.
          { echo "# Polysite $VERSION: image digests"; cat digests/cms.ref digests/web.ref digests/backup.ref; } > bundle/IMAGES.txt
          tar -C bundle -czf "dist/polysite-$VERSION-bundle.tar.gz" .
          cp bundle/IMAGES.txt dist/IMAGES.txt
          cp digests/*.spdx.json dist/
          cp notes/RELEASE_NOTES.md dist/
          (cd dist && sha256sum polysite-"$VERSION"-bundle.tar.gz IMAGES.txt ./*.spdx.json > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/polysite-${{ needs.prepare.outputs.version }}-bundle.tar.gz
      - name: Create the draft release
        run: |
          set -- "$TAG" --draft --verify-tag --title "Polysite $VERSION" --notes-file dist/RELEASE_NOTES.md
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease --latest=false; fi
          gh release create "$@" \
            "dist/polysite-$VERSION-bundle.tar.gz" dist/IMAGES.txt dist/SHA256SUMS
