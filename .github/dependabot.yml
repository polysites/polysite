# Weekly update proposals, as pull requests that CI then checks (lint, unit tests, image builds, the fresh-install smoke test and its
# end-to-end checks). Payload's packages must all be the same version, so they are updated together in one pull request.
# A new MAJOR version of anything is its own pull request: read it before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/cms
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 6
    ignore:
      # Their tool chain does not support these majors yet (typescript-eslint stops below TypeScript 6.1; the lint plugins stop at
      # ESLint 9). Take them by hand when it does, then remove the line.
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: eslint, update-types: ["version-update:semver-major"] }
    groups:
      payload:
        patterns: ["payload", "@payloadcms/*"]
        update-types: [minor, patch]
      next-and-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["payload", "@payloadcms/*", "next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 6
    groups:
      nuxt:
        patterns: ["nuxt", "@nuxt/*", "@nuxtjs/*", "nuxt-*", "vue", "vue-router"]
        update-types: [minor, patch]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["nuxt", "@nuxt/*", "@nuxtjs/*", "nuxt-*", "vue", "vue-router"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: monthly }
    groups:
      docs: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/apps/cms, /apps/web, /backup]
    schedule: { interval: monthly }
    ignore:
      # Production images stay on Node's long-term-support lines (even numbers); odd numbers are short-lived "current" releases.
      - { dependency-name: node, versions: ["23.x", "25.x", "27.x"] }
  # Every action is pinned to a commit SHA with its release in a trailing comment (uses: owner/repo@<sha> # v1.2.3). Dependabot reads
  # that comment and updates the SHA and the comment together. A new major version is its own pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
