# Production-parity local stack: real production builds (target: run) and a real `payload migrate` on boot.
# Run: docker compose up --build
# For day-to-day work add docker-compose.dev.yml (hot reload):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Production uses docker-compose.prod.yml instead (published images, Cloud SQL, no local db,
# Cloud SQL Auth Proxy, real domains) — see docs/guide/deploying.md.

name: polysite

# Docker keeps every container's log forever unless told otherwise, which fills a long-running server's disk. Each service keeps at most
# 5 files of 10 MB (50 MB), then drops the oldest.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Host ports can be changed in .env when one is taken (POLYSITE_HTTP_PORT: put the same port in SITE_DOMAIN and CMS_DOMAIN, such as localhost:8080).
      - "${POLYSITE_HTTP_PORT:-80}:${POLYSITE_HTTP_PORT:-80}"
      - "${POLYSITE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static-content:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    env_file: .env
    depends_on:
      - web
      - cms

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # The Dockerfile's last stage is `dev` (hot reload), which a bare build would
      # use. The dev override sets `target: dev` itself.
      target: run
    restart: unless-stopped
    # Runs unprivileged already; these also stop it gaining privileges or using kernel capabilities it has no use for.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: polysite-web
      # Read at runtime. nuxt.config.ts only has these as build-time defaults, and an
      # image build does not see .env, so without this Live Preview points at admin.localhost.
      NUXT_PUBLIC_CMS_SERVER_URL: ${CMS_SCHEME:-http}://${CMS_DOMAIN:-admin.localhost}
    volumes:
      - static-content:/app/.output/public
    depends_on:
      - cms

  cms:
    logging: *default-logging
    build:
      # Widened from ./apps/cms to the repo root (same pattern as
      # web above) so the build can see themes/ -- Sites.ts's
      # theme auto-discovery needs to scan it, both at build time and at
      # runtime inside the image.
      context: .
      dockerfile: apps/cms/Dockerfile
      target: run
    restart: unless-stopped
    # Runs unprivileged already; these also stop it gaining privileges or using kernel capabilities it has no use for.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: polysite-cms
    volumes:
      # Uploaded files (Media's staticDir is the relative path "media"). Without a
      # volume they live in the container and are lost on every redeploy.
      - media-data:/repo/apps/cms/media
    depends_on:
      - db

  db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only: the database password is a placeholder until .env is edited, and this file can end up on a server.
      - "127.0.0.1:${POLYSITE_DB_PORT:-5432}:5432"

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data

  # Scheduled database + media backups, and the tool to restore them. See
  # docs/guide/backups.md. The Postgres client must match the server's major
  # version: set POSTGRES_MAJOR in .env if your database isn't 16.
  backup:
    logging: *default-logging
    build:
      context: ./backup
      args:
        PG_MAJOR: ${POSTGRES_MAJOR:-16}
    restart: unless-stopped
    env_file: .env
    volumes:
      - media-data:/media:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      - db

  # Not started by `up`. Used on purpose: docker compose --profile restore run --rm restore latest --yes
  restore:
    logging: *default-logging
    profiles: ["restore"]
    build:
      context: ./backup
      args:
        PG_MAJOR: ${POSTGRES_MAJOR:-16}
    entrypoint: ["/opt/backup/restore.sh"]
    env_file: .env
    volumes:
      - media-data:/media
      - ${BACKUP_HOST_DIR:-./backups}:/backups

volumes:
  static-content:
  caddy-data:
  caddy-config:
  db-data:
  redis-data:
  media-data:
