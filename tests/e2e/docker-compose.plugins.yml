# Extra settings for the plugin end-to-end run (tests/e2e/run-with-plugins.sh), on top of the smoke stack's.
services:
  cms:
    environment:
      # Lets the single-sign-on plugin talk to the plain-http mock identity provider. Never set this on a real install.
      AUTH_SSO_ALLOW_HTTP: "1"
      # Turns on API keys, so their end-to-end check runs (off by default on a real install).
      AUTH_API_KEYS: "true"
      # The suite signs in far more often than a person would, all from one address through the proxy: lift the per-address limits for it only.
      POLYSITE_LOGIN_RATE_LIMIT: "100000"
      POLYSITE_RESET_RATE_LIMIT: "100000"
      # The machine-translation helper's check runs against the "echo" provider (it marks text instead of translating it; never set on a real install).
      POLYSITE_TRANSLATE_PROVIDER: echo
      POLYSITE_TRANSLATE_ALLOW_ECHO: "1"
      # Unpaid ticket places are held for eight seconds instead of twenty minutes, and the sweep runs every two seconds, so the check can watch a hold run out.
      EVENTS_HOLD_SECONDS: "8"
      EVENTS_SWEEP_MS: "2000"
      EVENTS_RETRY_MS: "3000"
